<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main class="container">
    <section class="image-section">
     <img src="assets/images/avatar-jessica.jpeg" alt="Jessica avatar" class="img">
     <div class="name-location">
      <h1>Jessica Randall</h1>
      <p>London, United Kingdom</p>
     </div>
     <p class="profile-description">"Front-end developer and avid reader."</p>
    </section>
    
    <section class="links-section">
      <a class="link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="link" href="#" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
      <a class="link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a class="link" href="#" target="_blank" rel="noopener noreferrer">Twitter</a>
      <a class="link" href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
    </section>
    

  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Bethel</a>.
  </footer>
</body>
</html>
